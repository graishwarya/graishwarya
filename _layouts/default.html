<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">✦ Aishwarya<span>.</span></a>
    <nav><a href="{{ '/' | relative_url }}">Blog</a><a href="https://github.com/graishwarya">GitHub profile ↗</a></nav>
  </header>
  <main class="container">{{ content }}</main>
  <footer>© {{ site.time | date: "%Y" }} Aishwarya · Build • Learn • Grow</footer>
</body>
</html>
